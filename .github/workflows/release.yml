name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build app
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/OpenTouch.app "OpenTouch-$GITHUB_REF_NAME.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "OpenTouch-$GITHUB_REF_NAME.zip" \
            --title "OpenTouch $GITHUB_REF_NAME" --generate-notes \
            --notes "Unzip, move OpenTouch.app to /Applications and open it. This build is not notarized by Apple, so the first time macOS blocks it: go to System Settings → Privacy & Security and click **Open Anyway**. See the README for the permissions it needs."
